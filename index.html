<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Datatilt · Suivi consultants</title>
<meta name="description" content="Plan de charge et disponibilité des consultants DATATILT">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232C47C9'/%3E%3Crect x='7' y='16' width='4' height='9' fill='white'/%3E%3Crect x='14' y='10' width='4' height='15' fill='white'/%3E%3Crect x='21' y='6' width='4' height='19' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

/* Layout : console opérationnelle à onglets (Mon planning / Équipe / Administration) — bandeau KPI, alertes + charge, heatmap par groupe, recherche de dispo */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141D27; --muted:#5A6573; --line:#DCE1E8; --soft:#EBEEF3;
  --accent:#2C47C9; --accent-ink:#FFFFFF;
  --t-build:#3550D6; --t-run:#0E8576; --t-avv:#C97A12; --t-int:#8A94A3; --t-abs:#B9C0CA;
  --h-low:#FBEBCF; --h-mid:#EDF0F4; --h-ok:#D8F0E1; --h-over:#F8D3CE; --h-over-ink:#9C2617; --h-low-ink:#7A4B06;
  --good:#127A4A; --warn:#A6620A; --bad:#B42318;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1319; --surface:#161D25; --ink:#E5E9EF; --muted:#94A0AE; --line:#2A3440; --soft:#1D2630;
  --accent:#8399FF; --accent-ink:#0E1319;
  --t-build:#7D93FF; --t-run:#3DC0AE; --t-avv:#EFAA45; --t-int:#717C8C; --t-abs:#4A5563;
  --h-low:#3A2D14; --h-mid:#1D2630; --h-ok:#143326; --h-over:#47201B; --h-over-ink:#FF9E90; --h-low-ink:#F5C77A;
  --good:#4CC98A; --warn:#F0AE4A; --bad:#FF8A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#161D25; --ink:#E5E9EF; --muted:#94A0AE; --line:#2A3440; --soft:#1D2630;
  --accent:#8399FF; --accent-ink:#0E1319;
  --t-build:#7D93FF; --t-run:#3DC0AE; --t-avv:#EFAA45; --t-int:#717C8C; --t-abs:#4A5563;
  --h-low:#3A2D14; --h-mid:#1D2630; --h-ok:#143326; --h-over:#47201B; --h-over-ink:#FF9E90; --h-low-ink:#F5C77A;
  --good:#4CC98A; --warn:#F0AE4A; --bad:#FF8A7A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.1rem} h3{font-size:1rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.top .id{display:flex;flex-direction:column;gap:2px}
.me{display:flex;gap:10px;align-items:center;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-width:0}
.me .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;flex:none}
.me .n{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.badge{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.admin{background:var(--accent);color:var(--accent-ink)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .count{font-family:var(--f-mono);font-size:.72rem;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.88rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-size:.88rem;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.8rem}

.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;border:1px dashed var(--t-avv);border-radius:10px;font-size:.88rem;background:var(--surface)}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--muted)}
.gauge{height:5px;border-radius:3px;background:var(--soft);position:relative;margin-top:4px}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.gauge b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.v.good{color:var(--good)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.alerts{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto;margin:0;padding:0;list-style:none}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;font-size:.88rem}
.alert::before{content:"";border-radius:2px;background:var(--muted)}
.alert.bad::before{background:var(--bad)} .alert.warn::before{background:var(--warn)} .alert.info::before{background:var(--accent)}
.alert .meta{color:var(--muted);font-size:.8rem}
.empty-note{color:var(--muted);font-size:.88rem}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw.hatch{background:repeating-linear-gradient(45deg,var(--t-abs) 0 2px,transparent 2px 4px);border:1px solid var(--t-abs)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
.heat th,.heat td{border-bottom:1px solid var(--line);padding:0}
.heat thead th{font-size:.72rem;font-weight:600;color:var(--muted);padding:8px 4px;text-align:center;background:var(--surface);white-space:nowrap}
.heat thead th.now{color:var(--accent)}
.heat .grp td{background:var(--soft);font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 12px}
.heat .who{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 12px;min-width:180px;z-index:1;border-right:1px solid var(--line)}
.heat .who button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.heat .who button:focus-visible{outline:2px solid var(--accent)}
.heat .who .n{font-weight:600;display:flex;gap:6px;align-items:center}
.heat .who .r{font-size:.74rem;color:var(--muted)}
.fresh{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--good);flex:none}
.fresh.stale{background:var(--warn)} .fresh.never{background:var(--t-abs)}
.c{min-width:62px;height:52px;position:relative;text-align:center;vertical-align:middle;font-family:var(--f-mono);font-size:.82rem;border-left:1px solid var(--bg)}
.c.low{background:var(--h-low);color:var(--h-low-ink)} .c.mid{background:var(--h-mid)} .c.ok{background:var(--h-ok)} .c.over{background:var(--h-over);color:var(--h-over-ink);font-weight:500}
.c.abs{background:repeating-linear-gradient(45deg,var(--soft) 0 5px,var(--surface) 5px 10px);color:var(--muted);font-size:.72rem}
.c .strip{position:absolute;left:4px;right:4px;bottom:4px;height:4px;display:flex;border-radius:2px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.c .strip i{display:block;height:100%}
.c .p{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--t-avv)}
.c.now{box-shadow:inset 0 0 0 2px var(--accent)}
.c .free{display:block;font-size:.68rem;opacity:.8}
.heat.big .c{height:64px;min-width:72px}
.heat-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.heat-legend span{display:inline-flex;gap:6px;align-items:center}
.heat-legend .sw{width:14px;height:10px}

.finder-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
.list .chk{width:28px;padding-right:0}
.list tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.selbar{gap:6px;font-size:.86rem}
.modal.wide{width:min(900px,100%)}
.modal textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;font-family:var(--f-mono);font-size:.8rem;color:var(--ink);width:100%;box-sizing:border-box;resize:vertical}
#bPrev{max-height:260px;overflow:auto}
#bPrev tr.bad td{background:color-mix(in srgb,var(--bad) 8%,transparent)}
label.f input,label.f select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;font-size:.9rem;color:var(--ink);width:100%}
.results{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.res{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg)}
.res .fit{font-family:var(--f-mono);font-weight:500}
.mini{display:flex;gap:2px;align-items:flex-end;height:24px}
.mini i{flex:1;background:var(--t-run);border-radius:1px;min-height:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.7rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent)}

.list th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr:hover td{background:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;white-space:nowrap}
.tag .sw{width:8px;height:8px;border-radius:50%}
.pill{font-size:.72rem;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ferme,.pill.ok{background:var(--h-ok);color:var(--good)} .pill.probable,.pill.wait{background:var(--h-low);color:var(--h-low-ink)}
.due.soon{color:var(--warn);font-weight:600} .due.past{color:var(--muted)}
.person{display:inline-flex;gap:8px;align-items:center}
.person img{width:22px;height:22px;border-radius:50%}

.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hello .actions{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.pick button{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pick button:hover{border-color:var(--accent)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;font-size:.88rem;min-width:0;flex:1}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:10px;font-size:.88rem}
.checks label{display:inline-flex;gap:6px;align-items:center}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.row-actions .r{display:flex;gap:8px}
.mstaff{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.mstaff li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:.86rem;align-items:center}
.mstaff li.grow{grid-template-columns:minmax(0,1fr)}
.inline.row1{flex-wrap:nowrap}
.inline.row1 input{min-width:90px}
@media (max-width:560px){.inline.row1{flex-wrap:wrap}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:30}
.state{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3n){border-right:0}.kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}.grid2{grid-template-columns:1fr}.finder-form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.wrap{padding-inline:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}.kpi:nth-child(2n){border-right:0!important}.form-grid{grid-template-columns:1fr}.res{grid-template-columns:minmax(0,1fr) auto}.res .mini,.res .chips{display:none}.hello{grid-template-columns:1fr}.me .n{max-width:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stack{display:flex;flex-direction:column;gap:20px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.login{max-width:460px;margin:6vh auto 0;width:100%}
.login-form{display:flex;flex-direction:column;gap:12px}
.login-msg{font-size:.9rem;min-height:1.5em}
.login-alt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-size:.86rem;cursor:pointer;text-decoration:underline}
/* v2 : saisie au jour */
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.small{font-size:.82rem}
.heat.days .c{min-width:46px;height:46px;font-size:.76rem}
.heat .c.hol,.dgrid td.hol{background:repeating-linear-gradient(45deg,var(--soft) 0 4px,var(--surface) 4px 8px);color:var(--muted);font-size:.66rem;font-family:var(--f-body);text-align:center}
.heat th.wk,.heat td.wk,.dgrid th.wk,.dgrid td.wk{border-left:2px solid var(--line)}
.heat thead th.wkh,.dgrid thead th.wkh{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px 2px}
.dgrid{border-collapse:collapse;width:100%}
.dgrid th,.dgrid td{border-bottom:1px solid var(--line)}
.dgrid thead th{font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 2px;text-align:center;min-width:50px;white-space:nowrap;background:var(--surface)}
.dgrid thead th.now{color:var(--accent)}
.dgrid .lbl{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 12px;min-width:210px;z-index:1;border-right:1px solid var(--line);font-size:.86rem;font-weight:500}
.dgrid .lbl small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}
.dgrid td.v{height:42px;text-align:center;font-family:var(--f-mono);font-size:.8rem;position:relative;padding:0}
.dgrid td.v button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;min-height:42px;cursor:pointer}
.dgrid td.v button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.dgrid td.v button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dgrid td.v.on{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.dgrid td.v input.cin{box-sizing:border-box;width:100%;height:42px;border:0;outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface);color:var(--ink);font:inherit;text-align:center;padding:0;-moz-appearance:textfield}
.dgrid td.v input.cin::-webkit-outer-spin-button,.dgrid td.v input.cin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dgrid td.v .cin-wait{display:flex;align-items:center;justify-content:center;min-height:42px;opacity:.5}
.dgrid td.v.ex::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.5;pointer-events:none}
.dgrid .mrow{width:100%}
.dgrid .rowdel{margin-left:auto;align-self:center;border:1px solid transparent;background:none;color:var(--muted);border-radius:6px;padding:2px 7px;font-size:.75rem;cursor:pointer;opacity:0;white-space:nowrap}
.dgrid tr:hover .rowdel,.dgrid .rowdel:focus-visible,.dgrid .rowdel.armed{opacity:1}
.dgrid .rowdel:hover{border-color:var(--line);color:var(--ink)}
.dgrid .rowdel.armed{color:var(--bad);border-color:var(--bad)}
@media (hover:none){.dgrid .rowdel{opacity:1}}
.dgrid td.v.gsel{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.dgrid .rowsel{all:unset;cursor:pointer;display:block;border-radius:4px}
.dgrid .rowsel:hover{color:var(--accent)}
.dgrid .rowsel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gselbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;margin-bottom:10px;border:1px solid var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));font-size:.86rem}
.gselbar[hidden]{display:none}
.gselbar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.gselbar #gselInfo{font-weight:600;margin-right:auto}
.gselbar label{display:flex;align-items:center;gap:6px}
.gselbar input{width:70px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:5px 8px;font:inherit;text-align:center}
.dgrid tr.addrow .lbl{padding:6px 8px}
.dgrid tr.addrow input{width:100%;box-sizing:border-box;font-size:.82rem;color:var(--ink)}
/* la cellule figée de la ligne d'ajout passe devant « Charge du jour » : sinon elle recouvre la liste */
.dgrid .addrow .lbl{z-index:3}
.ga-list{position:fixed;z-index:50;margin:0;padding:4px;list-style:none;max-height:min(360px,50vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:400}
.ga-list li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:.84rem}
.ga-list li > span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ga-list li small{color:var(--muted);font-size:.72rem;white-space:nowrap}
.ga-list li[aria-selected="true"],.ga-list li[data-gadd]:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ga-list li.more{cursor:default}
.dgrid tr.total td.v{font-weight:600;height:46px}
.dgrid tr.total .lbl{font-weight:600}
.navw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pcts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.pcts button,.wds button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:.86rem;font-weight:500;color:var(--ink)}
.pcts button[aria-pressed="true"],.wds button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pcts input{width:80px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;color:var(--ink)}
.wds{display:flex;gap:6px;flex-wrap:wrap}
.wds button{width:40px;padding:6px 0;text-align:center}
.radios{display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.radios label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.radios input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 8px;color:var(--ink)}
.drows{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;align-items:center}
.drow select,.drow input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;font-size:.88rem;width:100%;min-width:0;color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.total-line{font-family:var(--f-mono);font-size:.86rem}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.mrow{display:flex;gap:8px;align-items:center}
.modal h2{font-size:1.15rem}
.modal .eyebrow{display:block}
@media (max-width:1000px){.grid2.even{grid-template-columns:1fr}}
/* thème */
.top-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;min-width:0}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px}
.theme-btn svg{width:16px;height:16px;flex:none}
.express{margin:0;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:.9rem}
details.adv summary{cursor:pointer;color:var(--accent);font-size:.86rem;font-weight:500;padding:2px 0}
details.adv[open] summary{margin-bottom:12px}
select.big{font-size:1rem;padding:10px!important}
code{font-family:var(--f-mono);font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:4px}
</style>
<script>try{var t=localStorage.getItem("pdc.theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="id">
      <span class="eyebrow">DATATILT · Opérations</span>
      <h1>Plan de charge</h1>
    </div>
    <div class="top-right">
      <button type="button" class="btn small theme-btn" id="themeBtn" title="Changer de thème"></button>
      <div class="me" id="meChip" hidden></div>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="banner" hidden></div>
  <div id="main"><div class="state">Chargement…</div></div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
